<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6F5F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E11" media="(prefers-color-scheme: dark)">
<title>WashBoard — pas de connexion</title>
<style>
  /* Écran servi par le service worker quand le téléphone n'a pas de réseau (lancement de
     l'application sans connexion, page jamais consultée). Autonome : aucune requête autre
     que l'icône, elle aussi mise en cache à l'installation. Mêmes couleurs que l'écran de
     lancement (globals.css) ; clair/sombre selon le téléphone, le thème de l'app étant
     dans un cookie que cette page ne lit pas. */
  :root { color-scheme: light dark; --fond: #F6F5F3; --encre: #16161A; --gris: #6B6B76; --accent: #2B59FF; --filet: rgba(22,22,26,.12); }
  @media (prefers-color-scheme: dark) { :root { --fond: #0E0E11; --encre: #F4F4F6; --gris: #9A9AA6; --accent: #6A8CFF; --filet: rgba(244,244,246,.16); } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fond); color: var(--encre); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: calc(24px + env(safe-area-inset-top, 0px)) 28px calc(24px + env(safe-area-inset-bottom, 0px)); }
  img { width: 88px; height: 88px; border-radius: 22.5%; display: block; }
  h1 { font-size: 21px; margin: 28px 0 8px; font-weight: 650; letter-spacing: -.01em; }
  p { margin: 0; color: var(--gris); font-size: 15px; max-width: 300px; }
  button { margin-top: 26px; height: 46px; padding: 0 26px; border: 0; border-radius: 14px; background: var(--accent); color: #fff; font: 600 15px/1 inherit; font-family: inherit; }
  button:active { transform: scale(.97); }
  .etat { margin-top: 18px; font-size: 13px; }
</style>
</head>
<body>
<main>
  <img src="/icon-512.png" alt="" width="88" height="88">
  <h1>Pas de connexion</h1>
  <p>WashBoard a besoin d’internet pour afficher votre planning. Il se rouvre tout seul dès que le réseau revient.</p>
  <button type="button" id="reessayer">Réessayer</button>
  <p class="etat" id="etat" role="status" aria-live="polite"></p>
</main>
<script>
  // Le réseau revient : on relance la page demandée (l'adresse est celle d'origine, le service
  // worker a seulement répondu à sa place). Vérification légère toutes les 4 s, plus l'événement
  // « online » ; un essai manuel par le bouton.
  (function () {
    var etat = document.getElementById('etat');
    var occupe = false;
    function essayer(manuel) {
      if (occupe) return;
      occupe = true;
      if (manuel) etat.textContent = 'Vérification…';
      fetch('/api/health', { cache: 'no-store' })
        .then(function (r) { if (r.ok || r.status < 500) location.reload(); else throw new Error(); })
        .catch(function () { if (manuel) etat.textContent = 'Toujours pas de connexion.'; })
        .then(function () { occupe = false; });
    }
    document.getElementById('reessayer').addEventListener('click', function () { essayer(true); });
    window.addEventListener('online', function () { essayer(false); });
    setInterval(function () { essayer(false); }, 4000);
  })();
</script>
</body>
</html>

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: washboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: washboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (avec seuils de couverture)
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: dummy-maps-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  # Tests de bout en bout (Playwright) : ils lancent l'application réelle et la
  # pilotent dans un navigateur. C'est le seul filet qui couvre le parcours de
  # réservation complet et les écrans du dashboard — la CI ne les lançait pas
  # jusqu'au 2026-08-30, et le test du parcours client était cassé depuis deux
  # mois sans que personne ne le voie.
  #
  # ⚠️ Ces tests parlent à la VRAIE base Supabase (le projet n'a pas encore de
  # base de test séparée — voir TODO.md, priorité haute). Deux conséquences :
  #   - ils ne tournent que si les secrets sont configurés, donc jamais sur une
  #     pull request venant d'un fork (les secrets n'y sont pas exposés) ;
  #   - tout ce qu'ils créent est préfixé `[E2E]` sur le compte de test, et une
  #     étape de nettoyage finale tourne même si les tests échouent.
  # Le jour où une base de dédiée existe, il suffit de pointer les secrets
  # dessus : rien d'autre à changer ici.
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: washboard
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      TEST_WASHER_EMAIL: ${{ secrets.E2E_WASHER_EMAIL }}
      TEST_WASHER_PASSWORD: ${{ secrets.E2E_WASHER_PASSWORD }}
      TEST_WASHER_SLUG: ${{ secrets.E2E_WASHER_SLUG }}
      TEST_CLIENT_EMAIL: ${{ secrets.E2E_CLIENT_EMAIL }}
      # Rouvre /api/e2e/cleanup alors qu'on teste un build de production.
      # Cette variable ne doit JAMAIS être définie sur Vercel.
      E2E_CLEANUP_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: washboard/package-lock.json

      - name: Install
        run: npm ci

      # Sans secrets, l'application ne démarre pas et tous les tests
      # échoueraient de façon illisible. On le dit franchement et on s'arrête
      # là, plutôt que de laisser un job rouge que personne ne sait relire.
      # Sur la branche principale, l'absence de secrets fait ECHOUER le job.
      #
      # Auparavant, elle produisait un simple avertissement et le job passait au
      # vert : les 135 tests etaient sautes sans que rien ne le signale dans la
      # liste des verifications. Le nombre de tests ECRITS ne dit rien du nombre
      # reellement EXECUTE. Signale par un audit externe le 2026-09-05.
      #
      # Sur une branche de contributeur externe, les secrets ne sont pas
      # transmis par GitHub : on continue d'avertir sans bloquer, sinon aucune
      # contribution ne pourrait jamais passer.
      - name: Vérifier la présence des secrets
        id: secrets
        run: |
          if [ -n "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "::warning::Secrets E2E indisponibles sur un fork — tests de bout en bout ignorés."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Secrets E2E absents : les tests de bout en bout n'ont PAS été exécutés."
            exit 1
          fi

      - name: Installer le navigateur Playwright
        if: steps.secrets.outputs.present == 'true'
        run: npx playwright install --with-deps chromium

      - name: Build de production
        if: steps.secrets.outputs.present == 'true'
        run: npm run build

      - name: Tests de bout en bout
        if: steps.secrets.outputs.present == 'true'
        run: npx playwright test
        env:
          E2E_WEB_COMMAND: npm run start

      # Filet de sécurité : si un test s'est interrompu entre la création d'un
      # objet et son nettoyage, ce ménage final l'efface quand même. `always()`
      # pour qu'il tourne aussi quand les tests ont échoué — c'est justement là
      # que des déchets restent.
      - name: Nettoyage des données de test
        if: always() && steps.secrets.outputs.present == 'true'
        run: |
          npm run start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 >/dev/null && break
            sleep 2
          done
          curl -s -X POST http://localhost:3000/api/e2e/cleanup \
            -H 'Content-Type: application/json' \
            -d '{"prefix":"[E2E]"}' || true

      - name: Rapport Playwright
        if: always() && steps.secrets.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: washboard/playwright-report/
          retention-days: 7
